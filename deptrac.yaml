deptrac:
  paths:
    - ./src
  layers:
    - name: Plugin
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\NotificationsHelperPlugin$' }
    - name: Contract
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\Contract\\.*' }
    - name: Domain
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\Domain\\.*' }
    - name: Application
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\Application\\.*' }
    - name: Infrastructure
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\Infrastructure\\.*' }
    - name: UI
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NotificationsHelper\\UI\\.*' }
    - name: PluginCore
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\Core\\.*' }
    # Add one collector per plugin listed in `requires`, for its Contract\ namespace only, for example:
    #   - { type: classLike, value: '^SightPress\\Plugin\\AiHelper\\Contract\\.*' }
    - name: RequiredContract
      collectors:
        - { type: classLike, value: '^SightPress\\Plugin\\NoneRequired\\Contract\\.*' }
    # Plugins never use SightPress\Core\: no layer may depend on this one.
    - name: Core
      collectors:
        - { type: classLike, value: '^SightPress\\Core\\.*' }
    - name: Vendor
      collectors:
        - { type: classLike, value: '^(Symfony|Doctrine|Twig|Psr|PHPUnit)\\.*' }
  ruleset:
    Plugin: [Contract, Domain, Application, Infrastructure, UI, PluginCore, Vendor]
    Contract: [PluginCore, Vendor]
    Domain: [Contract, PluginCore, Vendor]
    Application: [Domain, Contract, PluginCore, RequiredContract, Vendor]
    Infrastructure: [Application, Domain, Contract, PluginCore, RequiredContract, Vendor]
    UI: [Application, Domain, Contract, PluginCore, RequiredContract, Vendor]
